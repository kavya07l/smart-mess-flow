{% extends "base.html" %}
{% block title %}Register · Smart Mess Flow{% endblock %}
{% block content %}
<section class="narrow-page">
  <div class="page-heading"><span class="eyebrow">Student account</span><h1>Create your account</h1><p>Register with your college ID to book mess slots.</p></div>
  <form class="card form-card" method="post">
    <label for="student_id">Student ID</label><input id="student_id" name="student_id" autocomplete="username" required>
    <label for="name">Full name</label><input id="name" name="name" autocomplete="name" required>
    <label for="password">Password</label><input id="password" name="password" type="password" minlength="6" autocomplete="new-password" required>
    <label for="type">Student type</label><select id="type" name="type" required><option value="">Choose your type</option><option value="hostel">Hostel student</option><option value="day">Day scholar</option></select>
    <button class="button primary full" type="submit">Create account</button>
    <p class="form-foot">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p>
  </form>
</section>
{% endblock %}
